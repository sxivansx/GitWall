name: Android app

# Compile check for the Android app. The APK users download is the signed
# build committed at public/gitwall.apk, so this workflow only verifies that
# the source still builds and keeps an unsigned artifact for inspection.
on:
  push:
    branches: [main]
    paths: ["android/**"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: gitwall-apk-unsigned-check
          path: android/app/build/outputs/apk/release/app-release.apk
